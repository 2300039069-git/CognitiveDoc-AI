services:
  - type: web
    name: cognitivedoc-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: cognitivedoc_ai
